name = "cf-ai-research-agent"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[durable_objects]
bindings = [
  { name = "RESEARCH_SESSION", class_name = "ResearchSession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResearchSession"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false
